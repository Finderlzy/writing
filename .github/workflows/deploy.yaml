name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      blogger_files:
        description: "手动发到 Blogger 的文章，相对 content/，空格分隔（如 blogs/awakening-in-yifu-506.md）；留空则不发"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache Quartz plugins
        uses: actions/cache@v6
        with:
          path: .quartz/plugins
          key: ${{ runner.os }}-plugins-${{ hashFiles('quartz.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-plugins-

      - run: npm ci

      - name: Install Quartz plugins
        run: npx quartz plugin install

      - name: Build Quartz
        run: npx quartz build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      # 给后面的 blogger 任务用：取文章标题、标签和正文
      - name: Upload content index
        uses: actions/upload-artifact@v4
        with:
          name: content-index
          path: public/static/contentIndex.json

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # 部署成功后，把这次新增的文章以「摘要 + 原文链接」发到 Blogger
  blogger:
    needs: deploy
    if: github.event_name == 'push' || inputs.blogger_files != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download content index
        uses: actions/download-artifact@v4
        with:
          name: content-index
          path: public/static

      - name: Post new articles to Blogger
        env:
          BLOGGER_POST_EMAIL: ${{ secrets.BLOGGER_POST_EMAIL }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BEFORE: ${{ github.event.before }}
          FILES: ${{ inputs.blogger_files }}
        run: |
          if [ -n "$FILES" ]; then
            python3 scripts/post_to_blogger.py --files "$FILES"
          else
            python3 scripts/post_to_blogger.py --base "$BEFORE" --head "$GITHUB_SHA"
          fi
