<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#F2A623" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#2EC4A0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="330" rx="14" fill="#1E1E1E"/>

  <rect x="20" y="20" width="310" height="215" rx="12" fill="#262626" stroke="#4A4A4A" stroke-width="1" stroke-dasharray="5 4"/>
  <rect x="350" y="20" width="310" height="215" rx="12" fill="#262626" stroke="#4A4A4A" stroke-width="1" stroke-dasharray="5 4"/>

  <circle cx="60" cy="60" r="6" fill="#8C8C8C"/>
  <circle cx="190" cy="50" r="6" fill="#8C8C8C"/>
  <circle cx="295" cy="70" r="6" fill="#8C8C8C"/>
  <circle cx="80" cy="205" r="6" fill="#8C8C8C"/>
  <circle cx="290" cy="200" r="6" fill="#8C8C8C"/>

  <circle cx="245" cy="125" r="10" fill="#A99CF2"/>
  <text x="245" y="105" fill="#C9C0FA" font-size="13" text-anchor="middle">熟人</text>

  <circle cx="175" cy="143" r="10" fill="none" stroke="#F2A623" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="122" y1="157" x2="161" y2="147" stroke="#F2A623" stroke-width="2.5" marker-end="url(#arrAmber)"/>
  <circle cx="110" cy="160" r="11" fill="#F2A623"/>
  <text x="110" y="187" fill="#F7C46A" font-size="13" text-anchor="middle">token</text>

  <ellipse cx="505" cy="135" rx="135" ry="90" fill="none" stroke="#5E5E5E" stroke-width="1.2"/>
  <ellipse cx="505" cy="135" rx="95" ry="63" fill="none" stroke="#5E5E5E" stroke-width="1.2"/>
  <ellipse cx="505" cy="135" rx="56" ry="37" fill="none" stroke="#5E5E5E" stroke-width="1.2"/>
  <ellipse cx="505" cy="135" rx="20" ry="13" fill="none" stroke="#5E5E5E" stroke-width="1.2"/>

  <polyline points="398,80 425,95 450,110 472,122 492,131" fill="none" stroke="#2EC4A0" stroke-width="2.5" marker-end="url(#arrTeal)"/>
  <circle cx="398" cy="80" r="7" fill="#2EC4A0"/>
  <circle cx="425" cy="95" r="5" fill="#2EC4A0"/>
  <circle cx="450" cy="110" r="5" fill="#2EC4A0"/>
  <circle cx="472" cy="122" r="5" fill="#2EC4A0"/>
  <text x="398" y="62" fill="#7FE0C7" font-size="13" text-anchor="middle">起点（山顶）</text>
  <text x="505" y="168" fill="#A8A8A8" font-size="13" text-anchor="middle">山脚</text>

  <text x="175" y="267" fill="#EDEDED" font-size="17" font-weight="600" text-anchor="middle">推理：世界不动，token 在走</text>
  <text x="175" y="295" fill="#A8A8A8" font-size="13.5" text-anchor="middle">参数固定，点朝“熟人”和“星星”移动</text>
  <text x="505" y="267" fill="#EDEDED" font-size="17" font-weight="600" text-anchor="middle">训练：参数自己在走</text>
  <text x="505" y="295" fill="#A8A8A8" font-size="13.5" text-anchor="middle">蒙着眼，沿最陡方向一小步一小步下山</text>
