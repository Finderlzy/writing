<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <style>
    .bg { fill: #FFFFFF; }
    .panel { fill: #F6F5F2; stroke: #CFCDC6; }
    .dot { fill: #B4B2A9; }
    .friend { fill: #7F77DD; }
    .friend-t { fill: #534AB7; }
    .amber { fill: #EF9F27; }
    .amber-s { stroke: #EF9F27; }
    .amber-t { fill: #BA7517; }
    .teal { fill: #1D9E75; }
    .teal-s { stroke: #1D9E75; }
    .teal-t { fill: #0F6E56; }
    .contour { stroke: #C9C7C0; }
    .title { fill: #222222; }
    .sub { fill: #6B6B6B; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1E1E1E; }
      .panel { fill: #262626; stroke: #4A4A4A; }
      .dot { fill: #8C8C8C; }
      .friend { fill: #A99CF2; }
      .friend-t { fill: #C9C0FA; }
      .amber { fill: #F2A623; }
      .amber-s { stroke: #F2A623; }
      .amber-t { fill: #F7C46A; }
      .teal { fill: #2EC4A0; }
      .teal-s { stroke: #2EC4A0; }
      .teal-t { fill: #7FE0C7; }
      .contour { stroke: #5E5E5E; }
      .title { fill: #EDEDED; }
      .sub { fill: #A8A8A8; }
    }
  </style>
  <defs>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="amber-s" d="M2 1L8 5L2 9" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="teal-s" d="M2 1L8 5L2 9" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="680" height="330" rx="14"/>

  <rect class="panel" x="20" y="20" width="310" height="215" rx="12" stroke-width="1" stroke-dasharray="5 4"/>
  <rect class="panel" x="350" y="20" width="310" height="215" rx="12" stroke-width="1" stroke-dasharray="5 4"/>

  <circle class="dot" cx="60" cy="60" r="6"/>
  <circle class="dot" cx="190" cy="50" r="6"/>
  <circle class="dot" cx="295" cy="70" r="6"/>
  <circle class="dot" cx="80" cy="205" r="6"/>
  <circle class="dot" cx="290" cy="200" r="6"/>

  <circle class="friend" cx="245" cy="125" r="10"/>
  <text class="friend-t" x="245" y="105" font-size="13" text-anchor="middle">熟人</text>

  <circle class="amber-s" cx="175" cy="143" r="10" fill="none" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line class="amber-s" x1="122" y1="157" x2="161" y2="147" stroke-width="2.5" marker-end="url(#arrAmber)"/>
  <circle class="amber" cx="110" cy="160" r="11"/>
  <text class="amber-t" x="110" y="187" font-size="13" text-anchor="middle">token</text>

  <ellipse class="contour" cx="505" cy="135" rx="135" ry="90" fill="none" stroke-width="1.2"/>
  <ellipse class="contour" cx="505" cy="135" rx="95" ry="63" fill="none" stroke-width="1.2"/>
  <ellipse class="contour" cx="505" cy="135" rx="56" ry="37" fill="none" stroke-width="1.2"/>
  <ellipse class="contour" cx="505" cy="135" rx="20" ry="13" fill="none" stroke-width="1.2"/>

  <polyline class="teal-s" points="398,80 425,95 450,110 472,122 492,131" fill="none" stroke-width="2.5" marker-end="url(#arrTeal)"/>
  <circle class="teal" cx="398" cy="80" r="7"/>
  <circle class="teal" cx="425" cy="95" r="5"/>
  <circle class="teal" cx="450" cy="110" r="5"/>
  <circle class="teal" cx="472" cy="122" r="5"/>
  <text class="teal-t" x="398" y="62" font-size="13" text-anchor="middle">起点（山顶）</text>
  <text class="sub" x="505" y="168" font-size="13" text-anchor="middle">山脚</text>

  <text class="title" x="175" y="267" font-size="17" font-weight="600" text-anchor="middle">推理：世界不动，token 在走</text>
  <text class="sub" x="175" y="295" font-size="13.5" text-anchor="middle">参数固定，点朝“熟人”和“星星”移动</text>
  <text class="title" x="505" y="267" font-size="17" font-weight="600" text-anchor="middle">训练：参数自己在走</text>
  <text class="sub" x="505" y="295" font-size="13.5" text-anchor="middle">蒙着眼，沿最陡方向一小步一小步下山</text>
</svg>
