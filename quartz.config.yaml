# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: 知行录
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: plausible
  locale: zh-CN
  baseUrl: finderlzy.github.io
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: local
    cdnCaching: true
    typography:
      header: Noto Sans SC
      body: Noto Sans SC
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#fdfdfb"
        lightgray: "#e8e6e1"
        gray: "#8a8780"
        darkgray: "#3a3a38"
        dark: "#1f1f1e"
        secondary: "#2c5a8c"
        tertiary: "#6b8aa8"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#fff23688"
      darkMode:
        light: "#1a1a19"
        lightgray: "#353431"
        gray: "#8d8a83"
        darkgray: "#d6d3cc"
        dark: "#eceae4"
        secondary: "#8fb1d6"
        tertiary: "#6b8aa8"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#b3aa0288"
  links:
    markdownLinkResolution: absolute
  contentIndex:
    enableSiteMap: true
    enableRSS: true
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: created
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 40
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 30
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: "@quartz-themes/core"
    enabled: false
    options:
      theme: tokyo-night
      mode: both
  - source: "@quartz-community/explicit-publish"
    enabled: false
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: false
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/cname"
    enabled: true
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: false
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: false
  - source: "@quartz-community/graph"
    enabled: true
    layout:
      position: right
      priority: 10
      condition: not-index
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: header
      priority: 20
      group: toolbar
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
      condition: not-index
  - source: "@quartz-community/content-meta"
    enabled: true
    options:
      showReadingTime: false
    layout:
      position: beforeBody
      priority: 20
      condition: not-index
  - source: "@quartz-community/tag-list"
    enabled: true
    layout:
      position: beforeBody
      priority: 30
      condition: has-tags
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: header
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: header
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: false
  - source: "@quartz-community/breadcrumbs"
    enabled: false
  - source: "@quartz-community/comments"
    enabled: true
    options:
      provider: giscus
      options:
        repo: finderlzy/finderlzy.github.io
        repoId: R_kgDOT9EtHA
        category: Comments
        categoryId: DIC_kwDOT9EtHM4DHOm0
        mapping: pathname
        strict: true
        reactionsEnabled: true
        inputPosition: top
        lightTheme: light
        darkTheme: dark
        lang: zh-CN
    layout:
      position: afterBody
      priority: 40
      condition: not-index
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        GitHub: https://github.com/finderlzy
        RSS: /index.xml
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/recent-notes"
    enabled: false
  - source: "@quartz-community/spacer"
    enabled: false
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  - source: "@quartz-community/note-properties"
    enabled: false
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.25rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    tag:
      template: full-width
    canvas: {}
    bases: {}
